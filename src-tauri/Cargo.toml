[package]
name = "komodo-pdf"
version = "0.1.2"
description = "A local-first, private PDF reader with grounded AI"
authors = ["you"]
edition = "2021"

[lib]
name = "komodo_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
tokio = { version = "1", features = ["sync"] }
futures-util = "0.3"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
anyhow = "1"
fastembed = "4"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
